
name: Build TitanTune Metal VST3

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "**"

jobs:
  build-windows-vst3:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch Signalsmith dependencies
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/Signalsmith-Audio/linear.git linear-dependency

          New-Item -ItemType Directory -Force -Path "Source/signalsmith-linear" | Out-Null

          Copy-Item -Path "linear-dependency/include/signalsmith-linear/*" -Destination "Source/signalsmith-linear/" -Recurse -Force

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/Signalsmith-Audio/signalsmith-stretch/main/signalsmith-stretch.h" `
            -OutFile "Source/signalsmith-stretch.h"

          if (!(Test-Path "Source/signalsmith-stretch.h")) {
            throw "Falta signalsmith-stretch.h"
          }

          if (!(Test-Path "Source/signalsmith-linear/stft.h")) {
            throw "Falta Signalsmith Linear stft.h"
          }

      - name: Configure project
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target TitanTuneMetal_VST3

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitanTune-Metal-Windows-VST3
          path: build/TitanTuneMetal_artefacts/Release/VST3/**
          if-no-files-found: error
